# n8n local para importar e rodar os workflows deste repositório.
# `docker compose up` → http://127.0.0.1:5678 → crie a conta de owner → Import from File.
services:
  n8n:
    image: n8nio/n8n:2.39.10
    ports:
      # Só no loopback: o n8n aqui não tem TLS nem proxy na frente.
      - "127.0.0.1:5678:5678"
    environment:
      # Sem chave fixa o n8n gera uma nova a cada start e as credenciais salvas viram lixo.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env}
      # Padrão é bloquear: sem isto toda expressão {{ $env.X }} falha com "access to env vars denied".
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: America/Sao_Paulo

      # host.docker.internal: os serviços rodam no host, o n8n roda no container.
      LEAD_ROUTER_URL: ${LEAD_ROUTER_URL:-http://host.docker.internal:8000}
      LEAD_ROUTER_API_KEY: ${LEAD_ROUTER_API_KEY:-}
      RAG_STARTER_KIT_URL: ${RAG_STARTER_KIT_URL:-http://host.docker.internal:8002}
      RAG_STARTER_KIT_API_KEY: ${RAG_STARTER_KIT_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
